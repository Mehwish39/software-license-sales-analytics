version: 2

models:
  - name: stg_customers
    description: Cleaned and standardized customer data.

    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: country
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - United Kingdom
                  - Germany
                  - France
                  - Netherlands
                  - Ireland
                  - Spain
                  - United States