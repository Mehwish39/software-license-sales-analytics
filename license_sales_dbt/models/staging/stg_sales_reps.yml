version: 2

models:
  - name: stg_sales_reps
    description: Cleaned and standardized sales representative data.

    columns:
      - name: sales_rep_id
        data_tests:
          - not_null
          - unique

      - name: sales_team
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Commercial
                  - Enterprise

      - name: hire_date
        data_tests:
          - not_null