version: 2

models:
  - name: stg_opportunities
    description: Cleaned and standardized sales opportunity data.

    columns:
      - name: opportunity_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: sales_rep_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sales_reps')
                field: sales_rep_id
              config:
                severity: warn

      - name: stage
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Prospecting
                  - Qualification
                  - Proposal
                  - Negotiation
                  - Closed Won
                  - Closed Lost

      - name: deal_value
        data_tests:
          - not_null

      - name: probability_pct
        data_tests:
          - not_null