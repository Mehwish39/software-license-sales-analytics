version: 2

models:
  - name: stg_products
    description: Cleaned and standardized software product data.

    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

      - name: billing_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Monthly
                  - Annual

      - name: list_price
        data_tests:
          - not_null