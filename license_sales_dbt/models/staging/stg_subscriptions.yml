version: 2

models:
  - name: stg_subscriptions
    description: Cleaned and standardized software subscription data.

    columns:
      - name: subscription_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Active
                  - Cancelled
                  - Expired
                  - Trial
                  - Unknown

      - name: seats
        data_tests:
          - not_null:
              config:
                severity: warn